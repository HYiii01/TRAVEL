<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.0"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='pic/logo.png') }}">
    <title>{% block title %}Travel Planner{% endblock %}</title>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden bg-gray-100">
    <nav class="flex-shrink-0 flex flex-wrap items-center gap-x-4 gap-y-3 px-4 py-4 sm:px-6 lg:px-8 bg-white border-b border-gray-200">
        <div class="min-w-0 flex-1 text-base font-semibold text-gray-800 sm:text-lg flex items-center gap-2">
            <a href="/" class="flex items-center gap-2 whitespace-nowrap">
                <img src="{{ url_for('static', path='pic/logo.png') }}" class="h-12 w-12 flex-shrink-0">
                <span>Travelll</span>
            </a>
        </div>

        <div class="order-3 flex w-full justify-center gap-4 text-sm sm:order-none sm:w-auto sm:gap-6 sm:text-base">
            <a href="/explore" class="text-gray-600 hover:text-gray-800">Explore</a>
            <a href="#" class="text-gray-600 hover:text-gray-800">Destinations</a>
            <a href="/overview" class="text-gray-600 hover:text-gray-800">Dashboard</a>
        </div>
        <div class="shrink-0">
            <a href="/profile" class="inline-flex items-center justify-center rounded-full bg-gray-200 p-2 hover:bg-gray-300 transition" aria-label="Open profile">
                <img src="{{ url_for('static', path='pic/user.png') }}" class="h-5 w-5">
            </a>
        </div>
    </nav>

    <div class="flex flex-1 p-4 gap-4 overflow-hidden">
        
        <aside class="w-64 flex-shrink-0 p-6 flex flex-col justify-between bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-y-auto">
            <div>
                <h1 class="text-2xl font-bold mb-4 text-slate-800 dark:text-white flex items-center gap-2">
                    <img src="{{ url_for('static', path='pic/dashboard.png') }}" class="h-5 w-5 flex-shrink-0">
                    <span>Dashboard</span>
                </h1>
                
                <ul class="space-y-1">
                    <li>
                        <a href="/overview" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3
                            {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/overview' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                            <span>Overview</span>
                        </a>
                    </li>
                    
                    <li>
                        <a href="/trips" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3
                            {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/trips' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                            <img src="{{ url_for('static', path='pic/map.png') }}" class="h-5 w-5 flex-shrink-0">
                            <span>My Trips</span>
                        </a>
                    </li>
                    
                    <li>
                        <a href="/wishlist" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3
                            {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/wishlist' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                            <img src="{{ url_for('static', path='pic/wishlist.png') }}" class="h-5 w-5 flex-shrink-0">
                            <span>Wishlist</span>
                        </a>
                    </li>

                    <li>
                        <a href="/collaborations" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3
                            {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/collaborations' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                            <img src="{{ url_for('static', path='pic/users.png') }}" class="h-5 w-5 flex-shrink-0">
                            <span>Collaborations</span>
                        </a>
                    </li>

                    <li>
                        <a href="/expenses" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3
                            {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/expenses' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                            <img src="{{ url_for('static', path='pic/receipt.png') }}" class="h-5 w-5 flex-shrink-0">
                            <span>Expenses</span>
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="space-y-1 pt-4 border-t border-slate-200 dark:border-slate-700">
                <a href="/profile/settings" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3 
                    {{ 'bg-sky-100 text-blue-700 font-semibold shadow-md' if request.url.path == '/profile/settings' else 'text-slate-600 hover:bg-blue-100 dark:text-slate-300 dark:hover:bg-slate-700' }}">
                    <img src="{{ url_for('static', path='pic/settings.png') }}" class="h-5 w-5 flex-shrink-0">
                    <span>Settings</span>
                </a>

                <a href="/logout" onclick="return confirm('Are you sure you want to logout?');" class="block w-full py-2 px-4 rounded-md transition-colors flex items-center space-x-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-950">
                    <img src="{{ url_for('static', path='pic/exit.png') }}" class="h-5 w-5 flex-shrink-0">
                    <span class="font-bold">Logout</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 overflow-y-auto">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>
</html>
