{% extends "index.html" %}

{% block content %}
<div class="flex-grow flex flex-col items-center justify-center w-full p-4 mt-4">

    <header class="mb-6 flex items-center justify-between w-full px-4 relative">
        <!-- 左侧占位（为了让中间的 h1 绝对居中，或者你也可以放其他东西） -->
        <div class="w-1/4"></div>

        <!-- 中间的标题和副标题 -->
        <div class="text-center flex-grow">
            <h1 class="text-2xl font-bold text-slate-800">✈️ Explore Your Next Destination</h1>
            <p class="text-sm text-slate-500">click the button or swipe the card to make a choice</p>
            <p class="text-sm text-slate-500">click the undo button to go back</p>
        </div>

        <!-- 右侧的 Search Bar（搜索栏） -->
        <div class="w-1/4 flex justify-end">
            <div class="relative">
                <input type="text" 
                    placeholder="Search destinations..." 
                    class="px-4 py-2 text-sm bg-slate-100 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-slate-400 w-48 sm:w-64 transition">
                <!-- 搜索图标（可选） -->
                <span class="absolute right-3 top-2.5 text-slate-400 text-sm">🔍</span>
            </div>
        </div>
    </header>


    <div class="relative w-80 h-[480px] mb-28" 
         x-data='swipeCards({{ attractions | tojson | safe }})'>
        
        <template x-if="cards.length > 0">
            <div class="relative w-full h-full">
                <template x-for="(item, index) in cards" :key="item.id || index">
                    <div class="card absolute inset-0 bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col select-none transition-all duration-300"
                         :class="{
                             'z-30 cursor-grab active:cursor-grabbing': index === 0,
                             'z-20 scale-95 translate-y-3 opacity-90 pointer-events-none': index === 1,
                             'z-10 scale-90 translate-y-6 opacity-60 pointer-events-none': index >= 2
                         }"
                         :style="index === 0 ? `transform: translate(${currentX}px, 0px) rotate(${currentX * 0.08}deg); transition: ${isDragging ? 'none' : 'transform 0.3s ease'};` : ''"
                         @touchstart="index === 0 && startDrag($event)"
                         @touchmove="index === 0 && onDrag($event)"
                         @touchend="index === 0 && endDrag()"
                         @mousedown="index === 0 && startDrag($event)"
                         @mousemove="index === 0 && onDrag($event)"
                         @mouseup="index === 0 && endDrag()"
                         @mouseleave="index === 0 && endDrag()">
                        
                        
                        <div class="w-full h-72 overflow-hidden bg-slate-200 pointer-events-none">
                            <img :src="item.image_url" 
                                 @error="$event.target.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80'"
                                 class="w-full h-full object-cover">
                        </div>
                        
                        <div class="p-5 flex flex-col justify-between flex-grow bg-white pointer-events-none">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800" x-text="item.name"></h2>
                                <p class="text-xs text-slate-500 mt-1" x-text="'📍 ' + item.city"></p>
                                <p class="text-sm text-slate-600 mt-2 line-clamp-2" x-text="item.description"></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>


        <template x-if="cards.length === 0">
            <div class="absolute inset-0 bg-white rounded-2xl shadow-xl flex flex-col items-center justify-center p-6 text-center">
                <span class="text-4xl mb-2">🎉</span>
                <h2 class="text-lg font-bold text-slate-800">You've seen all the recommendations!</h2>
                <p class="text-xs text-slate-500 mt-1">Go check your wishlist!</p>
                <button @click="resetCards()" class="mt-4 px-4 py-2 bg-slate-800 text-white text-sm rounded-xl shadow hover:bg-slate-700 transition">
                    Start Over
                </button>
            </div>
        </template>

        <div class="absolute -bottom-36 left-0 right-0 flex flex-col items-center gap-3">
            <div class="flex justify-center items-center gap-4">
                <button @click="swipe('left')" class="w-16 h-16 bg-white rounded-full shadow-lg flex items-center justify-center text-red-500 text-2xl hover:scale-110 transition active:scale-95">
                    <img src="{{ url_for('static', path='pic/dislike.png') }}" class="w-6 h-6">
                </button>
                <button @click="rewind()" 
                        :disabled="swipedHistory.length === 0"
                        class="w-12 h-12 bg-white rounded-full shadow-md flex items-center justify-center text-xl hover:scale-110 transition active:scale-95 disabled:opacity-40 disabled:hover:scale-100 cursor-pointer disabled:cursor-not-allowed">
                    <img src="{{ url_for('static', path='pic/undo.png') }}" class="w-5 h-5">
                </button>
                <button @click="swipe('right')" class="w-16 h-16 bg-white rounded-full shadow-lg flex items-center justify-center text-green-500 text-2xl hover:scale-110 transition active:scale-95">
                    <img src="{{ url_for('static', path='pic/like.png') }}" class="w-6 h-6">
                </button>
            </div>
            <p class="text-sm text-slate-600 font-medium">
                Wishlist: <span x-text="wishlist.length" class="font-bold text-slate-800"></span> items
            </p>
        </div>
    </div>

</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('swipeCards', (initialCards) => ({
            cards: initialCards || [],
            originalCards: [...initialCards],
            swipedHistory: [],
            wishlist: [],
            startX: 0,
            currentX: 0,
            isDragging: false,

            startDrag(e) {
                if (this.cards.length === 0) return;
                this.isDragging = true;
                this.startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            },

            onDrag(e) {
                if (!this.isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                this.currentX = clientX - this.startX;
            },

            endDrag() {
                if (!this.isDragging) return;
                this.isDragging = false;

                if (this.currentX > 100) {
                    this.swipe('right');
                } else if (this.currentX < -100) {
                    this.swipe('left');
                } else {
                    this.currentX = 0;
                }
            },

            swipe(direction) {
                if (this.cards.length === 0) return;
                this.currentX = direction === 'right' ? 400 : -400;

                setTimeout(() => {
                    const swipedCard = this.cards.shift();
                    this.swipedHistory.push({ card: swipedCard, direction: direction });
                    
                    if (direction === 'right') {
                        this.wishlist.push(swipedCard);
                    }

                    this.currentX = 0;
                }, 300);
            },

            rewind() {
                if (this.swipedHistory.length === 0) return;
                const lastAction = this.swipedHistory.pop();
                this.cards.unshift(lastAction.card);

                if (lastAction.direction === 'right') {
                    this.wishlist.pop();
                }

                this.currentX = 0;
            },

            resetCards() {
                this.cards = [...this.originalCards];
                this.swipedHistory = [];
                this.wishlist = [];
            }
        }))
    });
</script>
{% endblock %}
