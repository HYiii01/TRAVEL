{% extends "dashboard.html" %}

{% block content %}
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<style>
    #tripMap .mapboxgl-ctrl-group {
        border-radius: 0.75rem;
        overflow: hidden;
    }
</style>
<div x-data="travelApp()" x-init="initApp()" class="space-y-4">
    
    <!-- Pathway (My Trips > Malaysia > Day 1) -->
    <nav class="flex items-center text-sm font-semibold text-slate-500 bg-white dark:bg-slate-800 px-4 py-2.5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700">
        <ol class="inline-flex items-center space-x-1 md:space-x-2">
            <li>
                <button @click="backToTrips()" class="hover:text-purple-600 flex items-center gap-1.5 transition">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    <span>My Trips</span>
                </button>
            </li>
            <template x-if="currentTrip">
                <li class="flex items-center">
                    <svg class="w-4 h-4 text-slate-400 mx-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                    <button @click="selectDay('all')" class="hover:text-purple-600 text-slate-700 dark:text-slate-200" x-text="currentTrip.country || currentTrip.title"></button>
                </li>
            </template>
            <template x-if="currentTrip && selectedDayNum !== 'all'">
                <li class="flex items-center">
                    <svg class="w-4 h-4 text-slate-400 mx-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                    <span class="text-purple-600 font-bold" x-text="'Day ' + selectedDayNum"></span>
                </li>
            </template>
        </ol>
    </nav>

    <!-- Trip Cards -->
    <div x-show="!currentTrip" x-transition.opacity class="space-y-4">
        <div>
            <h2 class="text-xl font-black text-slate-800 dark:text-white">Select a Travel Plan</h2>
            <p class="text-xs text-slate-500">Pick a destination to view day schedules and location pins.</p>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <template x-for="trip in trips" :key="trip.id">
                <div @click="selectTrip(trip)" class="group cursor-pointer bg-white dark:bg-slate-800 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 hover:shadow-xl transition-all duration-300">
                    <div class="h-44 w-full overflow-hidden relative">
                        <img :src="trip.cover" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent"></div>
                        <span class="absolute top-3 left-3 flex items-center gap-1 bg-white/95 dark:bg-slate-900/90 text-purple-700 dark:text-purple-300 text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin w-3.5 h-3.5"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <span x-text="trip.country || 'Destination'"></span>
                        </span>
                        <h3 class="absolute bottom-3 left-3 text-white font-black text-lg" x-text="trip.title"></h3>
                    </div>
                    <div class="p-3.5 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                        <span x-text="(trip.days ? trip.days.length : 0) + ' Days Planned'"></span>
                        <span class="text-purple-600 font-bold group-hover:translate-x-1 transition-transform">Open Workspace</span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Day Selection Tabs -->
    <div x-show="currentTrip" x-transition.opacity class="space-y-4" style="display: none;">
        <div class="flex items-center justify-between gap-3">
            <div>
                <h2 class="text-xl font-black text-slate-800 dark:text-white" x-text="currentTrip?.title"></h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                    <span x-text="currentTrip?.country"></span> · Simple itinerary view
                </p>
            </div>
            <button @click="backToTrips()" type="button" class="hidden sm:flex items-center gap-1.5 text-xs font-bold text-purple-600 hover:text-purple-700">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                All trips
            </button>
        </div>
        
        <!-- Day Selection Tabs (All Days / Day 1 / Day 2) -->
        <div class="flex items-center justify-between gap-3 bg-white dark:bg-slate-800 p-2.5 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-1.5 overflow-x-auto">
                <button @click="selectDay('all')" 
                    :class="selectedDayNum === 'all' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition">
                    All Days
                </button>
                <template x-for="day in currentTrip?.days || []" :key="day.day_num">
                    <button @click="selectDay(day.day_num)" 
                        :class="selectedDayNum === day.day_num ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold transition">
                        <span x-text="'Day ' + day.day_num"></span>
                        <span class="text-[10px] opacity-75 font-normal ml-0.5" x-text="'(' + day.date + ')'"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Main Content Area: Left (Stops List) and Right (Map) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Left: Stops List -->
            <div class="lg:col-span-5 space-y-3 max-h-[600px] overflow-y-auto pr-1">
                <template x-for="day in currentTrip?.days || []" :key="day.day_num">
                    <div x-show="selectedDayNum === 'all' || selectedDayNum === day.day_num" class="space-y-2.5 bg-slate-50 dark:bg-slate-900/40 p-3 rounded-2xl border border-slate-200/70 dark:border-slate-800">
                        <div class="flex items-center gap-2 pb-1 border-b border-slate-200/70 dark:border-slate-800">
                            <span class="w-6 h-6 rounded-lg bg-purple-600 text-white flex items-center justify-center text-[10px] font-extrabold" x-text="day.day_num"></span>
                            <h4 class="text-sm font-bold text-slate-700 dark:text-slate-200" x-text="'Day ' + day.day_num"></h4>
                            <span class="text-xs text-slate-400" x-text="day.date"></span>
                        </div>
                        <div class="space-y-2">
                            <template x-for="stop in day.stops" :key="stop.id">
                                <div class="flex items-center gap-3 bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition cursor-pointer">
                                    <img :src="stop.img" alt="" class="w-16 h-16 object-cover rounded-lg flex-shrink-0">
                                    <div class="flex flex-col justify-between flex-grow">
                                        <h5 class="text-sm font-semibold text-slate-800 dark:text-slate-200" x-text="stop.name"></h5>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2" x-text="stop.desc"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Right: Map Area -->
            <div id="tripMap" x-ref="tripMap" data-token="{{ mapbox_token }}" class="lg:col-span-7 h-[600px] rounded-3xl overflow-hidden relative border border-slate-200/80 dark:border-slate-700 shadow-sm bg-slate-100 dark:bg-slate-900">
                <div x-show="!mapReady" class="absolute inset-0 z-10 flex items-center justify-center">
                    <div class="text-center">
                        <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-purple-100 text-purple-600 dark:bg-purple-900/40 dark:text-purple-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5 2V8l-5-2m0 12V6m0 2l-6-2" />
                            </svg>
                        </div>
                        <p class="text-sm font-semibold text-slate-600 dark:text-slate-300" x-text="mapMessage"></p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function travelApp() {
        return {
            trips: [],
            currentTrip: null,
            selectedDayNum: 'all',
            map: null,
            markers: [],
            mapReady: false,
            mapMessage: 'Select a trip to view its map',
            
            async initApp() {
                try {
                    const res = await fetch('/static/attractions.json');
                    const rawData = await res.json();
                    
                    if (Array.isArray(rawData) && rawData.length > 0 && !rawData[0].days) {
                        const formattedStops = rawData.map((item, idx) => ({
                            id: item.id || (idx + 1),
                            name: item.name || item.title || 'Attraction',
                            lat: parseFloat(item.lat || item.latitude),
                            lng: parseFloat(item.lng || item.longitude),
                            img: item.image_url || item.img || item.cover || '',
                            desc: item.description || item.desc || ''
                        }));

                        this.trips = [{
                            id: "malaysia-2025",
                            title: "Malaysia Highlights",
                            country: "Malaysia",
                            cover: formattedStops[0]?.img,
                            days: [
                                {
                                    day_num: 1,
                                    date: "10/05",
                                    stops: formattedStops.slice(0, 3)
                                },
                                {
                                    day_num: 2,
                                    date: "11/05",
                                    stops: formattedStops.slice(3)
                                }
                            ]
                        }];
                    } else {
                        this.trips = rawData;
                    }
                } catch (e) {
                    console.error("Failed to load /static/attractions.json", e);
                    this.mapMessage = 'Unable to load trip data';
                }
            },

            selectTrip(trip) {
                this.currentTrip = trip;
                if (window.TripStore) window.TripStore.select(trip);
                this.selectedDayNum = 'all';
                this.$nextTick(() => this.updateMap());
            },

            backToTrips() {
                this.currentTrip = null;
            },

            selectDay(dayNum) {
                this.selectedDayNum = dayNum;
                this.renderMarkers();
            },

            visibleStops() {
                if (!this.currentTrip) return [];
                return this.currentTrip.days
                    .filter((day) => this.selectedDayNum === 'all' || day.day_num === this.selectedDayNum)
                    .flatMap((day) => day.stops || [])
                    .filter((stop) => Number.isFinite(stop.lat) && Number.isFinite(stop.lng));
            },

            updateMap() {
                // Token safely
                const token = this.$refs.tripMap ? this.$refs.tripMap.dataset.token : '';

                if (!token) {
                    this.mapMessage = 'Map is unavailable: MAPBOX_ACCESS_TOKEN is not set';
                    return;
                }
                if (typeof mapboxgl === 'undefined') {
                    this.mapMessage = 'Map library could not be loaded';
                    return;
                }

                if (!this.map) {
                    mapboxgl.accessToken = token;
                    this.map = new mapboxgl.Map({
                        container: this.$refs.tripMap,
                        style: 'mapbox://styles/mapbox/streets-v12',
                        center: [101.6869, 3.139],
                        zoom: 5,
                    });
                    this.map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
                    
                    this.map.on('load', () => {
                        this.mapReady = true;
                        this.renderMarkers();
                    });
                } else {
                    // Prevents map from rendering gray when container is unhidden
                    this.map.resize();
                    this.renderMarkers();
                }
            },

            renderMarkers() {
                if (!this.map || !this.mapReady) return;

                // Clear existing markers
                this.markers.forEach((marker) => marker.remove());
                this.markers = [];

                const stops = this.visibleStops();
                if (!stops.length) return;

                const bounds = new mapboxgl.LngLatBounds();

                stops.forEach((stop) => {
                    // Create popup
                    const popup = new mapboxgl.Popup({ offset: 25, closeButton: false })
                        .setHTML(`
                            <div style="font-size: 12px; font-weight: 700; color: #1e293b; padding: 2px 4px;">
                                ${stop.name}
                            </div>
                        `);

                    // Purple marker
                    const marker = new mapboxgl.Marker({ color: '#9333ea' })
                        .setLngLat([stop.lng, stop.lat])
                        .setPopup(popup)
                        .addTo(this.map);

                    // Store reference
                    marker._stopId = stop.id;
                    this.markers.push(marker);
                    
                    bounds.extend([stop.lng, stop.lat]);
                });

                this.map.fitBounds(bounds, { padding: 50, maxZoom: 14, duration: 600 });
            },

            focusStop(stop) {
                if (!this.map) return;
                
                this.map.flyTo({
                    center: [stop.lng, stop.lat],
                    zoom: 14,
                    essential: true
                });

                const targetMarker = this.markers.find(m => m._stopId === stop.id);
                if (targetMarker) {
                    targetMarker.togglePopup();
                }
            }
        };
    }
</script>
{% endblock %}
