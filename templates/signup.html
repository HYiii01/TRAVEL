{% extends "index.html" %}

{% block content %}
<div class="h-full bg-gradient-to-br from-purple-50/60 via-pink-50/40 to-blue-50/50"
     hx-boost="true"
     x-data="{ errorMessage: '' }">
    
    <div class="min-h-[calc(100vh-5rem)] flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
        <div class="relative mx-auto flex w-full max-w-md flex-col overflow-hidden rounded-3xl bg-white/85 px-6 py-10 sm:px-10 sm:py-12 shadow-[0_20px_50px_rgba(148,163,184,0.15)] ring-1 ring-white/60 backdrop-blur-xl">

            <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden">
                <div class="absolute -top-12 -left-12 h-64 w-64 rounded-full bg-[#ffccff] mix-blend-multiply blur-[80px] opacity-60"></div>
                <div class="absolute top-1/3 left-1/3 -translate-x-1/2 -translate-y-1/2 h-80 w-80 rounded-full bg-[#d8c4ff] mix-blend-multiply blur-[90px] opacity-50"></div>
                <div class="absolute -bottom-12 -right-12 h-64 w-64 rounded-full bg-[#b7e3ff] mix-blend-multiply blur-[80px] opacity-60"></div>
            </div>

            <div class="relative z-10 w-full">
                <div class="mb-8 grid grid-cols-2 gap-1 rounded-2xl bg-slate-100/80 p-1 text-xs sm:text-sm font-medium">
                    <a href="/signup" class="rounded-xl py-2 text-center text-slate-800 bg-white shadow-sm ring-1 ring-slate-900/5 transition">Sign up</a>
                    <a href="/login" class="rounded-xl py-2 text-center text-slate-400 hover:text-slate-700 transition">Login</a>
                    
                </div>

                <div class="mb-6 text-center">
                    <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight text-slate-800">Create an account</h2>
                    <p class="mt-1 text-xs sm:text-sm text-slate-500">Get started with your free account</p>
                </div>

                <!-- Signup Form -->
                <form id="signupForm"
                      hx-post="/signup"
                      hx-swap="none"
                      hx-on::after-request="showSignupError(event)"
                      class="space-y-4">
                    <div class="space-y-3.5">
                        <div>
                            <div id="signupError"
                                 class="auth-error mb-2 hidden items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-600"
                                 role="alert">
                                <svg class="h-4 w-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span id="signupErrorText"></span>
                            </div>
                            <label for="name" class="mb-1.5 block text-xs font-medium text-slate-600">Username</label>
                            <input type="text" id="name" name="name" placeholder="Your username" required 
                                   class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>

                        <div>
                            <label for="email" class="mb-1.5 block text-xs font-medium text-slate-600">Email</label>
                            <input type="email" id="email" name="email" placeholder="name@example.com" required 
                                   class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>

                        <div>
                            <label for="password" class="mb-1.5 block text-xs font-medium text-slate-600">Password</label>
                            <input type="password" id="password" name="password" placeholder="At least 6 characters" required maxlength="72" 
                                   class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>
                    </div>

                    <button type="submit" 
                            class="w-full mt-2 rounded-2xl bg-slate-900 py-3 text-sm font-medium text-white shadow-md shadow-slate-900/10 transition-all hover:bg-slate-800 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-4 focus:ring-purple-100/60">
                        Sign up
                    </button>
                </form>

                <div class="relative my-6 flex items-center justify-center">
                    <div class="w-full border-t border-slate-200/80"></div>
                    <span class="absolute bg-white/90 px-3 text-xs uppercase tracking-wider text-slate-400">or continue with</span>
                </div>

                <!-- Google Signup Button (At the Bottom) -->
                <a href="/auth/google" 
                   hx-boost="false"
                   class="flex w-full items-center justify-center gap-3 rounded-2xl border border-slate-200/80 bg-white/90 px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition-all hover:bg-slate-50 hover:border-slate-300 active:scale-[0.99]">
                    <svg class="h-4 w-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Google</span>
                </a>

            </div>
        </div>
    </div>
</div>

<script>
  function showSignupError(event) {
    const xhr = event.detail.xhr;
    if (xhr.status >= 200 && xhr.status < 300) return;

    let message = 'Signup failed. Please try again.';
    try {
      const response = JSON.parse(xhr.responseText);
      message = response.message || message;
    } catch (error) {
    }
    const errorBox = document.getElementById('signupError');
    const errorText = document.getElementById('signupErrorText');
    if (!errorBox || !errorText) return;
    errorText.textContent = message;
    errorBox.classList.remove('hidden');
    errorBox.classList.add('flex');
    errorBox.classList.remove('auth-error');
    void errorBox.offsetWidth;
    errorBox.classList.add('auth-error');
  }

</script>
<style>
  .auth-error {
    animation: auth-error-in 260ms ease-out, auth-error-shake 360ms ease-in-out 260ms;
  }

  @keyframes auth-error-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes auth-error-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
</style>
{% endblock %}
