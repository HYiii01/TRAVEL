{% extends "index.html" %}

{% block content %}
<div class="h-full bg-gradient-to-br from-purple-50/60 via-pink-50/40 to-blue-50/50"
     x-data="{ errorMessage: '' }"
     @htmx:response-error.window="errorMessage = JSON.parse($event.detail.xhr.responseText).message">
    
    <div class="min-h-[calc(100vh-5rem)] flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
        
        <div class="relative mx-auto flex w-full max-w-md flex-col overflow-hidden rounded-3xl bg-white/85 backdrop-blur-xl px-6 py-10 sm:px-10 sm:py-12 shadow-[0_20px_50px_rgba(148,163,184,0.15)] ring-1 ring-white/60">
            

            <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
                <div class="absolute -top-12 -left-12 w-64 h-64 rounded-full bg-[#ffccff] mix-blend-multiply blur-[80px] opacity-60"></div>
                <div class="absolute top-1/3 left-1/3 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-[#d8c4ff] mix-blend-multiply blur-[90px] opacity-50"></div>
                <div class="absolute -bottom-12 -right-12 w-64 h-64 rounded-full bg-[#b7e3ff] mix-blend-multiply blur-[80px] opacity-60"></div>
            </div>

            <div class="relative z-10 w-full">
                <div class="mb-6 sm:mb-8 text-center">
                    <h2 class="text-2xl sm:text-3xl font-semibold text-slate-800 tracking-tight">Create Account</h2>
                    <p class="mt-1.5 text-xs sm:text-sm text-slate-500">
                        Already have an account? 
                        <a href="/login" class="font-medium text-purple-600 hover:text-purple-700 transition-colors underline underline-offset-4">Log in</a>
                    </p>
                </div>

                <div class="mb-6 grid grid-cols-2 gap-1.5 rounded-2xl bg-slate-100/80 p-1.5 text-xs sm:text-sm font-medium">
                    <a href="/signup" class="rounded-xl px-4 py-2.5 text-center text-slate-800 bg-white shadow-sm ring-1 ring-slate-900/5 transition">Sign up</a>
                    <a href="/login" class="rounded-xl px-4 py-2.5 text-center text-slate-400 hover:text-slate-700 transition">Login</a>
                </div>


                <div x-show="errorMessage" 
                     x-transition 
                     class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs sm:text-sm rounded-2xl" 
                     x-text="errorMessage"></div>


                <form hx-post="/signup" hx-swap="none" class="space-y-4">
                    <div class="space-y-3.5">
                        <div>
                            <label for="name" class="mb-1.5 block text-xs font-medium text-slate-600">Username</label>
                            <input type="text" name="name" placeholder="Your username" required class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>

                        <div>
                            <label for="email" class="mb-1.5 block text-xs font-medium text-slate-600">Email</label>
                            <input type="email" name="email" placeholder="name@example.com" required class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>

                        <div>
                            <label for="password" class="mb-1.5 block text-xs font-medium text-slate-600">Password</label>
                            <input type="password" name="password" placeholder="At least 6 characters" required maxlength="72" class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-100/60">
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-2 rounded-2xl bg-slate-900 px-4 py-3.5 text-sm font-medium text-white shadow-md shadow-slate-900/10 transition-all hover:bg-slate-800 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-4 focus:ring-purple-100/60">
                        Sign up
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
